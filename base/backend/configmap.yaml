apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: k8s-lab
data:
  nginx.conf: |
    worker_processes  1;
    events { worker_connections  1024; }
    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;
        server {
            listen       80;
            server_name  localhost;
            location = /api/health {
                access_log off;
                return 200 '{"status":"ok","service":"backend"}\n';
                add_header Content-Type application/json;
            }
            location / {
                access_log off;
                return 200 '{"status":"ok","service":"backend"}\n';
                add_header Content-Type application/json;
            }
        }
    }