version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      - TERRAFORM_VERSION="1.9.8"
      - 'curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"'
      - unzip -o terraform.zip -d /usr/local/bin
      - terraform version

  pre_build:
    commands:
      - echo "Starting Terraform apply..."
      - echo "Current directory:"
      - pwd
      - echo "Source directory:"
      - echo "$CODEBUILD_SRC_DIR"
      - echo "Build artifact directory:"
      - echo "$CODEBUILD_SRC_DIR_BuildArtifact"
      - echo "Source files:"
      - find "$CODEBUILD_SRC_DIR" -maxdepth 2 -type f
      - echo "Build artifact files:"
      - find "$CODEBUILD_SRC_DIR_BuildArtifact" -maxdepth 2 -type f
      - echo "Initializing Terraform..."
      - terraform init -input=false

  build:
    commands:
      - echo "Applying Terraform plan from previous stage..."
      - ls -lh "$CODEBUILD_SRC_DIR_BuildArtifact/tfplan"
      - terraform apply -input=false -auto-approve "$CODEBUILD_SRC_DIR_BuildArtifact/tfplan"

  post_build:
    commands:
      - echo "Terraform apply completed."
      - echo "Exporting kubeconfig for verification..."
      - mkdir -p kubeconfig
      - 'terraform output -raw kubeconfig > kubeconfig/kubeconfig.yaml || echo "Warning: Could not export kubeconfig"'
      - ls -la kubeconfig/

artifacts:
  files:
    - kubeconfig/kubeconfig.yaml
  name: terraform-apply-artifact