version: 0.2

phases:
  install:
    commands:
      - 'echo "Installing Terraform..."'
      - 'export TERRAFORM_VERSION=1.9.8'
      - 'curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"'
      - 'unzip -o terraform.zip -d /usr/local/bin'
      - 'terraform version'
      - 'echo "Installing Helm..."'
      - 'export HELM_VERSION=v3.16.2'
      - 'curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"'
      - 'tar -xzf helm.tar.gz'
      - 'mv linux-amd64/helm /usr/local/bin/helm'
      - 'helm version'

  pre_build:
    commands:
      - 'echo "Starting Terraform apply..."'
      - 'pwd'
      - 'echo "Source directory: ${CODEBUILD_SRC_DIR}"'
      - 'echo "Build artifact directory: ${CODEBUILD_SRC_DIR_BuildArtifact}"'
      - 'echo "Source files:"'
      - 'find "${CODEBUILD_SRC_DIR}" -maxdepth 2 -type f'
      - 'echo "Build artifact files:"'
      - 'find "${CODEBUILD_SRC_DIR_BuildArtifact}" -maxdepth 2 -type f'
      - 'echo "Initializing Terraform..."'
      - 'terraform init -input=false'
      - 'terraform validate'
      - 'test -f "${CODEBUILD_SRC_DIR_BuildArtifact}/tfplan" || { echo "ERROR: Saved Terraform plan not found."; exit 1; }'
      - 'ls -lh "${CODEBUILD_SRC_DIR_BuildArtifact}/tfplan"'
      - 'echo "Terraform state contents:"'
      - 'terraform state list 2>/dev/null || echo "(state is empty)"'

  build:
    on-failure: ABORT
    commands:
      - 'echo "Adopting any existing Helm releases into Terraform state..."'
      - 'aws eks update-kubeconfig --name saud-eks-lab --region ap-southeast-2 --alias adopt 2>/dev/null || echo "Cluster not reachable yet - skipping adoption"'
      - 'export KUBECONFIG=/root/.kube/config'
      - 'for SPEC in "helm_release.argocd:argocd:argocd" "helm_release.aws_load_balancer_controller:aws-load-balancer-controller:kube-system" "helm_release.metrics_server:metrics-server:kube-system"; do TF_ADDR=$(echo $SPEC | cut -d: -f1); REL=$(echo $SPEC | cut -d: -f2); NS=$(echo $SPEC | cut -d: -f3); if terraform state list 2>/dev/null | grep -q "^${TF_ADDR}$"; then echo "[SKIP] $TF_ADDR already in state"; elif helm status $REL -n $NS >/dev/null 2>&1; then echo "Importing existing release $NS/$REL into $TF_ADDR"; terraform import "$TF_ADDR" "$NS/$REL" || echo "  import failed - will retry next run"; else echo "No existing release $REL - nothing to import"; fi; done'
      - 'echo "Applying saved Terraform plan..."'
      - 'terraform apply -input=false -auto-approve "${CODEBUILD_SRC_DIR_BuildArtifact}/tfplan" || { echo "Apply failed — post_build skipped."; exit 1; }'

  post_build:
    commands:
      - 'echo "Exporting kubeconfig..."'
      - 'mkdir -p kubeconfig'
      - 'terraform output -raw kubeconfig > kubeconfig/kubeconfig.yaml 2>/dev/null || echo "WARNING: kubeconfig output not available (apply may have failed or output not defined)."'
      - 'test -s kubeconfig/kubeconfig.yaml && echo "Kubeconfig exported successfully." || echo "Kubeconfig not available."'
      - 'ls -lh kubeconfig/'

artifacts:
  files:
    - 'kubeconfig/kubeconfig.yaml'
  name: terraform-apply-artifact